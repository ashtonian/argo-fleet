# Argo CD Helm chart values for the lovely approach.
#
# Installs a Config Management Plugin sidecar that replaces cluster identity
# tokens with charmap and renders with argocd-lovely-plugin. The
# fleet-bootstrap Application that uses it is a second Helm release, made
# from lovely/bootstrap-values.yaml with the argocd-apps chart, because a
# release cannot create Argo CD resources before it has installed their CRDs.
#
# Every cluster uses these values unchanged. What differs per cluster is the
# cluster-identity Secret (group, cluster name), created before the install,
# for example by External Secrets from a secrets manager.
#
# Chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
# Tested with chart 10.10.2 (Argo CD v3.5.4).

configs:
  params:
    # ApplicationSets never delete Applications, whatever their own
    # syncPolicy says. Removing an application is a deliberate step.
    applicationsetcontroller.policy: create-update
    # The plugin needs the working tree only; do not stream Git history to
    # it on every render.
    reposerver.plugin.tar.exclusions: .git

repoServer:
  volumes:
    # Scratch space for the sidecar's per-render repository copies. Disk
    # backed and bounded, so it does not count against the memory limit.
    - name: lovely-charmap-tmp
      emptyDir:
        sizeLimit: 2Gi

  extraContainers:
    - name: lovely-charmap
      # Built from lovely/cmp (argocd-lovely-plugin, charmap and the plugin
      # configuration). Pin the digest the release workflow prints.
      image: ghcr.io/ashtonian/argo-fleet-lovely-cmp:1.0.0
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: GROUP
          valueFrom:
            secretKeyRef:
              name: cluster-identity
              key: group
        - name: CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: cluster-identity
              key: cluster-name
        # Directory, relative to the repository root, in which charmap
        # replaces tokens on every render. It must contain every file an
        # Application uses, including bases referenced by relative path.
        - name: RENDER_ROOT
          value: lovely
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          memory: 1Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        # var-files and plugins are created by the chart: the first carries
        # the argocd-cmp-server binary, the second the plugin's socket.
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: lovely-charmap-tmp
          mountPath: /tmp
