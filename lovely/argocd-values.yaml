# Argo CD Helm chart values for the lovely approach.
#
# Installs a Config Management Plugin sidecar that replaces tokens with
# charmap and renders with argocd-lovely-plugin. The token values come from
# each Application's spec, which the fleet ApplicationSets fill from the
# cluster's registration Secret (identity/cluster-secret.example.yaml), so
# the sidecar mounts no Secret and needs no restart when a value changes.
#
# The fleet-bootstrap ApplicationSet is a second Helm release, made from
# lovely/bootstrap-values.yaml with the argocd-apps chart, because a release
# cannot create Argo CD resources before it has installed their CRDs. Every
# cluster uses these values unchanged.
#
# Chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
# Tested with chart 10.10.2 (Argo CD v3.5.4).

configs:
  params:
    # ApplicationSets never delete Applications, whatever their own
    # syncPolicy says. Removing an application is a deliberate step.
    applicationsetcontroller.policy: create-update
    # The plugin needs the working tree only; do not stream Git history to
    # it on every render.
    reposerver.plugin.tar.exclusions: .git

repoServer:
  volumes:
    # Scratch space for the sidecar's per-render repository copies. Disk
    # backed and bounded, so it does not count against the memory limit.
    - name: lovely-charmap-tmp
      emptyDir:
        sizeLimit: 2Gi

  extraContainers:
    - name: lovely-charmap
      # Built from lovely/cmp (argocd-lovely-plugin, charmap and the plugin
      # configuration) by the CMP image workflow, which prints the digest.
      image: ghcr.io/ashtonian/argo-fleet-lovely-cmp:2.0.0@sha256:611c7c1673c933ef7ad499eb8c9a75b51ca765be5b04acb2e11c048404dc35cd
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        # Directory, relative to the repository root, in which charmap
        # replaces tokens on every render. It must contain every file an
        # Application uses, including bases referenced by relative path.
        - name: RENDER_ROOT
          value: lovely
        # Files under RENDER_ROOT whose path matches this regular expression
        # have their tokens replaced; others are left as they are. Binary
        # files, such as packaged Helm charts, must not match.
        - name: RENDER_INCLUDE
          value: '\.(ya?ml|json|conf|cfg|ini|toml|properties|txt|tpl)$'
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          memory: 1Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        # var-files and plugins are created by the chart: the first carries
        # the argocd-cmp-server binary, the second the plugin's socket.
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: lovely-charmap-tmp
          mountPath: /tmp

controller:
  metrics:
    enabled: true
    # Adds the Applications' fleet labels to argocd_app_labels, as
    # label_fleet_ashtonian_dev_revision and label_fleet_ashtonian_dev_group:
    # with argocd_app_info's sync and health status, the count of clusters
    # running each revision healthily.
    applicationLabels:
      enabled: true
      labels:
        - fleet.ashtonian.dev/revision
        - fleet.ashtonian.dev/group
