# Argo CD Helm chart values for the lovely approach.
#
# Installs a Config Management Plugin sidecar that replaces cluster identity
# tokens with charmap and renders with argocd-lovely-plugin, and the
# fleet-bootstrap Application that installs the fleet AppProject and
# ApplicationSets through it.
#
# Every cluster uses these values. Per cluster, two things differ:
#   - the cluster-identity Secret (group, cluster name), created before the
#     install, for example by External Secrets from a secrets manager;
#   - fleet.revision, the Git revision the cluster follows (see README,
#     "Staged rollout").
#
# Chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
# Tested with chart 10.10.2 (Argo CD v3.5.4).

fleet:
  # -- Git revision of this repository the cluster deploys: a branch, tag or
  # commit SHA. Clusters in the same rollout ring share a value.
  revision: main
  # -- Directory, relative to the repository root, in which charmap replaces
  # tokens on every render. It must contain every file an Application uses,
  # including bases referenced by relative path.
  renderRoot: lovely

configs:
  params:
    # ApplicationSets never delete Applications, whatever their own
    # syncPolicy says. Removing an application is a deliberate step.
    applicationsetcontroller.policy: create-update
    # The plugin needs the working tree only; do not stream Git history to
    # it on every render.
    reposerver.plugin.tar.exclusions: .git

repoServer:
  volumes:
    # Scratch space for the sidecar's per-render repository copies. Disk
    # backed and bounded, so it does not count against the memory limit.
    - name: lovely-charmap-tmp
      emptyDir:
        sizeLimit: 2Gi

  extraContainers:
    - name: lovely-charmap
      # Built from lovely/cmp (argocd-lovely-plugin, charmap and the plugin
      # configuration). Pin the digest the release workflow prints.
      image: ghcr.io/ashtonian/argo-fleet-lovely-cmp:1.0.0
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: GROUP
          valueFrom:
            secretKeyRef:
              name: cluster-identity
              key: group
        - name: CLUSTER_NAME
          valueFrom:
            secretKeyRef:
              name: cluster-identity
              key: cluster-name
        - name: REVISION
          value: "{{ .Values.fleet.revision }}"
        - name: RENDER_ROOT
          value: "{{ .Values.fleet.renderRoot }}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          memory: 1Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        # var-files and plugins are created by the chart: the first carries
        # the argocd-cmp-server binary, the second the plugin's socket.
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: lovely-charmap-tmp
          mountPath: /tmp

extraObjects:
  # The project of the fleet-bootstrap Application: it may only manage the
  # fleet's AppProject and ApplicationSets in this namespace.
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: fleet-bootstrap
      namespace: "{{ .Release.Namespace }}"
    spec:
      description: Installs the fleet AppProject and ApplicationSets.
      sourceRepos:
        - https://github.com/ashtonian/argo-fleet.git
      destinations:
        - server: https://kubernetes.default.svc
          namespace: "{{ .Release.Namespace }}"
      clusterResourceWhitelist: []
      namespaceResourceWhitelist:
        - group: argoproj.io
          kind: AppProject
        - group: argoproj.io
          kind: ApplicationSet

  # Renders lovely/bootstrap through the plugin, which replaces the identity
  # tokens in the ApplicationSets before the ApplicationSet controller reads
  # them.
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: fleet-bootstrap
      namespace: "{{ .Release.Namespace }}"
    spec:
      project: fleet-bootstrap
      source:
        repoURL: https://github.com/ashtonian/argo-fleet.git
        targetRevision: "{{ .Values.fleet.revision }}"
        path: lovely/bootstrap
        plugin:
          name: lovely-charmap
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .Release.Namespace }}"
      syncPolicy:
        automated:
          # Pruning an ApplicationSet deletes every Application it owns.
          prune: false
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
