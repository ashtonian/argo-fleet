apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-cache
  labels:
    app: edge-cache
    tier: addon
    fleet.ashtonian.dev/group: "<::GROUP::>"
    fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-cache
  template:
    metadata:
      labels:
        app: edge-cache
        tier: addon
        fleet.ashtonian.dev/group: "<::GROUP::>"
        fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
    spec:
      containers:
        - name: edge-cache
          image: busybox:1.37
          command: ['sh', '-c', 'echo "edge cache on <::CLUSTER_NAME::>" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
