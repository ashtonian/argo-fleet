apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-operator
  labels:
    app: gpu-operator
    tier: addon
    fleet.ashtonian.dev/group: "<::GROUP::>"
    fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-operator
  template:
    metadata:
      labels:
        app: gpu-operator
        tier: addon
        fleet.ashtonian.dev/group: "<::GROUP::>"
        fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
    spec:
      containers:
        - name: gpu-operator
          image: busybox:1.37
          command: ['sh', '-c', 'echo "gpu operator on <::CLUSTER_NAME::>" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
