apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    app: ingress
    tier: base
    fleet.ashtonian.dev/group: "<::GROUP::>"
    fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
        tier: base
        fleet.ashtonian.dev/group: "<::GROUP::>"
        fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
    spec:
      containers:
        - name: ingress
          image: busybox:1.37
          command: ['sh', '-c', 'echo "ingress controller on <::CLUSTER_NAME::>" && sleep 3600']
          env:
            - name: PUBLIC_URL
              value: "https://ingress.<::REGION::>.example.com/healthz"
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
