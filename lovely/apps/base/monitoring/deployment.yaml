apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  labels:
    app: monitoring
    tier: base
    fleet.ashtonian.dev/group: "<::GROUP::>"
    fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
  annotations:
    fleet.ashtonian.dev/rendered-from: "<::REVISION::>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
        tier: base
        fleet.ashtonian.dev/group: "<::GROUP::>"
        fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
    spec:
      containers:
        - name: monitoring
          image: busybox:1.37
          command: ['sh', '-c', 'echo "monitoring agent on <::CLUSTER_NAME::> in <::REGION::>" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
