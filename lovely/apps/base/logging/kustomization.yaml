apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
# The ConfigMap's name carries a hash of its rendered content, so a changed
# value rolls the pods that mount it.
configMapGenerator:
  - name: logging-config
    files:
      - logging.conf
# The group's Component: the token makes each cluster build with its own
# group's overrides. A group without a Component fails to render.
components:
  - "../../../components/groups/<::GROUP::>"
