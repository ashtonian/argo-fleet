apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging
  labels:
    app: logging
    tier: base
    fleet.ashtonian.dev/group: "<::GROUP::>"
    fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging
  template:
    metadata:
      labels:
        app: logging
        tier: base
        fleet.ashtonian.dev/group: "<::GROUP::>"
        fleet.ashtonian.dev/cluster: "<::CLUSTER_NAME::>"
    spec:
      containers:
        - name: logging
          image: busybox:1.37
          command: ['sh', '-c', 'echo "log collector on <::CLUSTER_NAME::>" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
          volumeMounts:
            - name: config
              mountPath: /etc/logging
      volumes:
        - name: config
          configMap:
            name: logging-config
