# Approach 1: overlay. One ApplicationSet per cluster, applied to that
# cluster's own Argo CD. Each cluster's copy points the generator at its own
# directory under overlay/clusters; this one is cluster-001's.
#
# The ApplicationSet keeps Applications and their resources when the
# generator stops matching (a renamed or deleted directory): removing an
# application from a cluster is a deliberate step, not a side effect.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: overlay
  namespace: argocd
spec:
  description: Applications generated by the overlay ApplicationSet.
  sourceRepos:
    - https://github.com/ashtonian/argo-fleet.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "!argocd"
    - server: https://kubernetes.default.svc
      namespace: "!kube-*"
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: overlay-cluster-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/ashtonian/argo-fleet.git
        revision: HEAD
        directories:
          - path: overlay/clusters/cluster-001/*
  template:
    metadata:
      name: "overlay-{{.path.basename}}"
    spec:
      project: overlay
      source:
        repoURL: https://github.com/ashtonian/argo-fleet.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
