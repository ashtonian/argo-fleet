name: CMP image

# Publishes lovely/cmp as ghcr.io/ashtonian/argo-fleet-lovely-cmp:<version>
# when a cmp-v<version> tag is pushed, e.g. cmp-v1.0.0. Each platform is
# checked to run a charmap built for it before the job succeeds. Pin the
# digest from the job summary in lovely/argocd-values.yaml.

on:
  push:
    tags: ["cmp-v*"]

permissions: {}

concurrency:
  group: cmp-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ashtonian/argo-fleet-lovely-cmp

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#cmp-v}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: lovely/cmp
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=argo-fleet-lovely-cmp
            org.opencontainers.image.description=argocd-lovely-plugin with charmap for the argo-fleet lovely approach
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Verify every platform
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            # The classic image store keeps one local image per reference, so
            # the previous platform's copy must go before this one is pulled.
            docker image rm --force "$REF" >/dev/null 2>&1 || true
            out=$(docker run --rm --pull always --platform "$platform" --entrypoint charmap "$REF" version)
            echo "$platform: $out"
            [[ $out == *" $platform" ]] || { echo "::error::$platform image runs charmap for ${out##* }"; exit 1; }
          done
          echo "Pin: \`$IMAGE:$VERSION@${REF#*@}\`" >> "$GITHUB_STEP_SUMMARY"
