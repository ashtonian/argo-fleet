# Approach 2: matrix. A hub-and-spoke layout: one Argo CD instance (the hub)
# deploys to every cluster listed under matrix/clusters, each of which must
# be registered with the hub as a cluster Secret whose server matches its
# config.yaml. It is not meant for an Argo CD running in every cluster.
#
# Both child generators are Git generators, and both would emit "path"
# parameters; pathParamPrefix keeps them apart (.cluster.path, .app.path).
#
# The ApplicationSets keep Applications and their resources when a generator
# stops matching (a removed config.yaml, a mistyped group): removing an
# application from a cluster is a deliberate step, not a side effect.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: matrix
  namespace: argocd
spec:
  description: Applications generated by the matrix ApplicationSets.
  sourceRepos:
    - https://github.com/ashtonian/argo-fleet.git
  destinations:
    - server: "*"
      namespace: "!argocd"
    - server: "*"
      namespace: "!kube-*"
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
# Base applications: every cluster gets every application, rendered through
# its group's Kustomize overlay under matrix/groups/<group>/apps.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-base-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ashtonian/argo-fleet.git
              revision: HEAD
              files:
                - path: matrix/clusters/*/config.yaml
              pathParamPrefix: cluster
          - git:
              repoURL: https://github.com/ashtonian/argo-fleet.git
              revision: HEAD
              directories:
                - path: "matrix/groups/{{.group}}/apps/*"
              pathParamPrefix: app
  template:
    metadata:
      name: "{{.cluster_name}}-base-{{.app.path.basename}}"
    spec:
      project: matrix
      source:
        repoURL: https://github.com/ashtonian/argo-fleet.git
        targetRevision: HEAD
        path: "{{.app.path.path}}"
      destination:
        server: "{{.cluster_server}}"
        namespace: "{{.app.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
---
# Cluster addons: only clusters with an addons/<app> directory under
# matrix/clusters/<cluster> get that addon.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: matrix-cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ashtonian/argo-fleet.git
              revision: HEAD
              files:
                - path: matrix/clusters/*/config.yaml
              pathParamPrefix: cluster
          - git:
              repoURL: https://github.com/ashtonian/argo-fleet.git
              revision: HEAD
              directories:
                - path: "matrix/clusters/{{.cluster_name}}/addons/*"
              pathParamPrefix: app
  template:
    metadata:
      name: "{{.cluster_name}}-addon-{{.app.path.basename}}"
    spec:
      project: matrix
      source:
        repoURL: https://github.com/ashtonian/argo-fleet.git
        targetRevision: HEAD
        path: "{{.app.path.path}}"
      destination:
        server: "{{.cluster_server}}"
        namespace: "{{.app.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
