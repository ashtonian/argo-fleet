apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  labels:
    app: monitoring
    tier: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
        tier: base
    spec:
      containers:
        - name: monitoring
          image: busybox:1.37
          command: ['sh', '-c', 'echo "monitoring agent running in $FLEET_REGION" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
          # The cluster's identity and values (fleet-identity), as FLEET_<KEY>.
          envFrom:
            - prefix: FLEET_
              configMapRef:
                name: fleet-identity
