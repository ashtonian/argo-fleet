apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  labels:
    app: ingress
    tier: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      labels:
        app: ingress
        tier: base
    spec:
      containers:
        - name: ingress
          image: busybox:1.37
          command: ['sh', '-c', 'echo "ingress controller running in $FLEET_REGION" && sleep 3600']
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"
          # The cluster's identity and values (fleet-identity), as FLEET_<KEY>.
          envFrom:
            - prefix: FLEET_
              configMapRef:
                name: fleet-identity
