apiVersion: v1
kind: Service
metadata:
  name: ingress
  labels:
    app: ingress
    tier: base
  annotations:
    # REGION is replaced with the cluster's value (see kustomization.yaml).
    external-dns.alpha.kubernetes.io/hostname: ingress.REGION.example.com
spec:
  selector:
    app: ingress
  ports:
    - name: http
      port: 80
