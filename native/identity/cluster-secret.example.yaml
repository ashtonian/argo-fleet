# This cluster's registration with its own Argo CD, carrying its identity.
# Labels select: the generators match managed, the ApplicationSets read group.
# Annotations carry values. Write it by hand like this, or from a secrets
# manager with external-secret.example.yaml. Exactly one Secret per cluster
# may carry the managed label.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet.ashtonian.dev/managed: "true"
    # Label values: at most 63 characters of letters, digits, '-', '_', '.'.
    fleet.ashtonian.dev/group: us-east
    # Informational, for promotion tooling: which ring the cluster is in.
    fleet.ashtonian.dev/ring: canary
  annotations:
    # The Git revision the cluster runs: a tag or commit for a pinned ring.
    fleet.ashtonian.dev/revision: main
    # Comma-separated addons, each a directory under native/apps/addons.
    fleet.ashtonian.dev/addons: gpu-operator
    # Every values.fleet.ashtonian.dev/<KEY> annotation becomes key <KEY> of
    # the fleet-identity ConfigMap in each Application's namespace. REGION is
    # required by native/apps/base/ingress.
    values.fleet.ashtonian.dev/REGION: us-east-1
type: Opaque
stringData:
  # The cluster's name: a label value, and CLUSTER_NAME in fleet-identity.
  name: cluster-001
  # The cluster itself, with the controller's own in-cluster credentials.
  server: https://kubernetes.default.svc
  config: "{}"
