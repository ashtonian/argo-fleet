# Writes the cluster's registration Secret from a secrets-manager entry such as
#   {"name": "cluster-001", "group": "us-east", "ring": "canary",
#    "revision": "v1.4.0", "addons": "gpu-operator",
#    "values": {"REGION": "us-east-1"}}
# name, group and revision are required: without them nothing is written.
# Every property of "values" becomes a values.fleet.ashtonian.dev/<KEY>
# annotation, so a new value changes neither this file nor Git. A change to
# the entry reaches the cluster within refreshInterval, and the
# ApplicationSets apply it with no restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-local
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet
  dataFrom:
    - extract:
        key: fleet/cluster-001
  target:
    name: fleet-local
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          fleet.ashtonian.dev/managed: "true"
          fleet.ashtonian.dev/group: "{{ .group }}"
          fleet.ashtonian.dev/ring: '{{ index . "ring" }}'
        annotations:
          fleet.ashtonian.dev/revision: "{{ .revision }}"
          fleet.ashtonian.dev/addons: '{{ index . "addons" }}'
      templateFrom:
        # A nested object arrives as a JSON string. keys accepts only an
        # object, so any other JSON in "values" fails the ExternalSecret.
        - target: Annotations
          literal: |
            {{- $values := index . "values" | default "{}" | mustFromJson }}
            {{- range $key := keys $values }}
            values.fleet.ashtonian.dev/{{ $key }}: {{ get $values $key | toString | toJson }}
            {{- end }}
      data:
        name: "{{ .name }}"
        server: https://kubernetes.default.svc
        config: "{}"
