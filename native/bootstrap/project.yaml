# The project every generated native fleet Application belongs to. Applications
# deploy only from this repository, only to this cluster, never into Argo CD's
# or Kubernetes' own namespaces, and create no cluster-scoped resource except
# their Namespace. Grant a real operator (CRDs, ClusterRoles) its own project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fleet
  namespace: argocd
spec:
  description: Base applications and group addons generated by the fleet ApplicationSets.
  sourceRepos:
    - https://github.com/ashtonian/argo-fleet.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "!argocd"
    - server: https://kubernetes.default.svc
      namespace: "!kube-*"
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
