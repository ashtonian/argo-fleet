# Keeps the cluster's registration Secret (cluster-secret.example.yaml) current
# from a secrets manager. It reads two entries:
#
#   fleet/cluster-001, one per cluster:
#     {"name": "cluster-001", "group": "us-east", "ring": "canary",
#      "addons": "gpu-operator", "values": {"REGION": "us-east-1"}}
#   fleet/rings, one for the fleet, the revision each ring runs:
#     {"revisions": {"canary": "<commit>", "stable": "<commit>"}}
#
# Promoting a ring is one write to fleet/rings. A "revision" in a cluster's
# own entry pins that cluster instead. Every property of "values" becomes a
# values.fleet.ashtonian.dev/<KEY> annotation, so a new value changes neither
# this file nor Git.
#
# creationPolicy Merge updates the Secret the provisioner wrote and never
# creates or deletes it: until the Secret exists External Secrets waits, and
# deleting this ExternalSecret leaves the last identity in place. A missing
# entry, an entry without name or group, or a "values" that is not a JSON
# object fails the ExternalSecret, which then leaves the Secret unchanged. A
# cluster with neither its own revision nor one for its ring gets an empty
# revision, which the ApplicationSets reject, so nothing changes either.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-local
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet
  dataFrom:
    - extract:
        key: fleet/cluster-001
    - extract:
        key: fleet/rings
  target:
    name: fleet-local
    creationPolicy: Merge
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
          fleet.ashtonian.dev/managed: "true"
          fleet.ashtonian.dev/group: "{{ .group }}"
          fleet.ashtonian.dev/ring: '{{ index . "ring" }}'
        annotations:
          # The cluster's own revision, else its ring's. Both missing renders
          # an empty annotation, which the ApplicationSets reject.
          fleet.ashtonian.dev/revision: >-
            {{- $rings := index . "revisions" | default "{}" | mustFromJson -}}
            {{- index . "revision" | default (get $rings (index . "ring") | toString) -}}
          fleet.ashtonian.dev/addons: '{{ index . "addons" }}'
      templateFrom:
        # A nested object arrives as a JSON string. keys accepts only an
        # object, so any other JSON in "values" fails the ExternalSecret.
        - target: Annotations
          literal: |
            {{- $values := index . "values" | default "{}" | mustFromJson }}
            {{- range $key := keys $values }}
            values.fleet.ashtonian.dev/{{ $key }}: {{ get $values $key | toString | toJson }}
            {{- end }}
      data:
        name: "{{ .name }}"
        server: https://kubernetes.default.svc
        config: "{}"
