# A cluster's registration with its own Argo CD, carrying its identity: the
# same contract for the native and lovely approaches. Labels select: the
# generators match managed, the ApplicationSets read group. Annotations carry
# values.
#
# The provisioner writes this before Argo CD renders the fleet. It can write
# all of it, or only the seed (the secret-type label and stringData) and let
# external-secret.example.yaml fill in the rest. Exactly one Secret per
# cluster may carry the managed label.
apiVersion: v1
kind: Secret
metadata:
  name: fleet-local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet.ashtonian.dev/managed: "true"
    # Label values: at most 63 characters of letters, digits, '-', '_', '.'.
    fleet.ashtonian.dev/group: us-east
    # The rollout ring, which picks the revision in external-secret.example.yaml.
    fleet.ashtonian.dev/ring: canary
  annotations:
    # The Git revision the cluster runs: a full commit SHA at scale, since
    # Argo CD resolves any other revision with a Git request every 3 minutes.
    # It also labels every Application, so it must be a valid label value.
    fleet.ashtonian.dev/revision: main
    # Comma-separated addons, each a directory under <approach>/apps/addons.
    fleet.ashtonian.dev/addons: gpu-operator
    # Every values.fleet.ashtonian.dev/<KEY> annotation is a value: key <KEY>
    # of native's fleet-identity ConfigMap, or lovely's <::KEY::> token. Use
    # [A-Za-z_][A-Za-z0-9_]* names. REGION is used by both examples.
    values.fleet.ashtonian.dev/REGION: us-east-1
type: Opaque
stringData:
  # The cluster's name: a label value, and CLUSTER_NAME in the manifests.
  name: cluster-001
  # The cluster itself, with the controller's own in-cluster credentials.
  server: https://kubernetes.default.svc
  config: "{}"
